name: Windows C++20 CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Set up FFmpeg Shared Dev Libraries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\
          $ffmpeg_dir = (Get-ChildItem -Path C:\ -Filter "ffmpeg-*-win64-gpl-shared" -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpeg_dir" >> $env:GITHUB_ENV
          echo "$ffmpeg_dir\bin" >> $env:GITHUB_PATH
          echo "Installed FFmpeg at $ffmpeg_dir"

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAVE_BUILD_TESTS=ON -DAVE_BUILD_VULKAN_PROBE=ON -DAVE_BUILD_DESKTOP=ON

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name 'DontShowUI' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          ctest --test-dir build --output-on-failure --timeout 60
