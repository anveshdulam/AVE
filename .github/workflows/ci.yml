name: Windows C++20 CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: ashley-tauro/action-install-ninja@v1
        with:
          version: 1.12.1

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.0
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAVE_BUILD_TESTS=ON -DAVE_BUILD_VULKAN_PROBE=ON -DAVE_BUILD_DESKTOP=OFF

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        run: |
          ctest --test-dir build --output-on-failure

