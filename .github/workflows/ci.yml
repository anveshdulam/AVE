name: Windows C++20 CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.268.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Set up Qt 6.8.3
        id: install-qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up FFmpeg LGPL Shared Dev Libraries
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ -Force
          Remove-Item ffmpeg.zip -Force
          $ffmpeg_dir = (Get-ChildItem -Path C:\ -Filter "ffmpeg-*-win64-lgpl-shared" -Directory | Select-Object -First 1).FullName
          if (-not $ffmpeg_dir -or -not (Test-Path "$ffmpeg_dir\include\libavformat\avformat.h")) {
            throw "Failed to locate extracted LGPL FFmpeg SDK under C:\"
          }
          $buildconf = (& "$ffmpeg_dir\bin\ffmpeg.exe" -buildconf 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg.exe -buildconf failed" }
          if ($buildconf -match '(?m)(?:^|\s)--enable-(?:gpl|nonfree|libx264|libx265|libxvid|libfdk-aac|libvidstab|avisynth|libdavs2|libxavs2)(?:\s|$)') {
            throw "Forbidden GPL/nonfree FFmpeg configuration flag detected:`n$buildconf"
          }
          if ($buildconf -notmatch '(?:^|\s)--enable-shared(?:\s|$)') {
            throw "Expected shared FFmpeg build (--enable-shared missing):`n$buildconf"
          }
          echo "Verified LGPL shared FFmpeg buildconf at $ffmpeg_dir"
          echo "FFMPEG_DIR=$ffmpeg_dir" >> $env:GITHUB_ENV
          echo "$ffmpeg_dir\bin" >> $env:GITHUB_PATH
          echo "Installed LGPL FFmpeg at $ffmpeg_dir"

      - name: Cache vcpkg binary archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-archives
          key: vcpkg-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-windows-

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}\vcpkg-archives
        run: |
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { $env:VCPKG_ROOT }
          if (-not $vcpkgRoot -or -not (Test-Path "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "vcpkg toolchain not found (VCPKG_INSTALLATION_ROOT='$env:VCPKG_INSTALLATION_ROOT', VCPKG_ROOT='$env:VCPKG_ROOT')"
          }
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -and (Test-Path "$vcpkgRoot\.git")) {
            git -C $vcpkgRoot cat-file -e "${baseline}^{commit}" 2>$null
            if ($LASTEXITCODE -ne 0) {
              git -C $vcpkgRoot fetch origin $baseline --depth=1 2>$null
              if ($LASTEXITCODE -ne 0) {
                git -C $vcpkgRoot fetch --unshallow origin 2>$null
              }
            }
          }
          $qtPrefix = "${{ steps.install-qt.outputs.qt-root-dir }}".Replace('\', '/')
          $ffmpegDir = "$env:FFMPEG_DIR".Replace('\', '/')
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$($vcpkgRoot.Replace('\', '/'))/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$qtPrefix" `
            -DFFMPEG_DIR="$ffmpegDir" `
            -DAVE_BUILD_TESTS=ON `
            -DAVE_BUILD_VULKAN_PROBE=ON `
            -DAVE_BUILD_DESKTOP=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify FFmpeg CMake Resolution and Runtime Linkage
        shell: pwsh
        run: |
          $expectedInclude = "$($env:FFMPEG_DIR.Replace('\', '/'))/include"
          $cachedIncludeLine = Select-String -Path build\CMakeCache.txt -Pattern '^FFmpeg_INCLUDE_DIR:PATH=' | Select-Object -First 1
          if (-not $cachedIncludeLine -or ($cachedIncludeLine.Line -ne "FFmpeg_INCLUDE_DIR:PATH=$expectedInclude")) {
            throw "CMake did not resolve expected FFmpeg include dir '$expectedInclude': $($cachedIncludeLine.Line)"
          }
          $exeDeps = (dumpbin /dependents build\apps\desktop\ave_desktop.exe | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on ave_desktop.exe" }
          foreach ($lib in @('avformat-', 'avcodec-', 'avutil-', 'swscale-', 'swresample-')) {
            if ($exeDeps -notmatch "$lib\d+\.dll") {
              throw "Expected dynamically linked FFmpeg DLL matching '$lib*.dll' missing from ave_desktop.exe"
            }
          }
          $deployedFfDlls = Get-ChildItem -Path build\apps\desktop -File | Where-Object { $_.Name -match '^(?:av|sw).+\.dll$' }
          if (@($deployedFfDlls).Count -lt 5) {
            throw "Expected at least 5 deployed FFmpeg runtime DLLs in build\apps\desktop, found $(@($deployedFfDlls).Count)"
          }
          $gplArtifactDlls = Get-ChildItem -Path build\apps\desktop, build\tests -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)(?:postproc|x264|x265|xvid|fdk-aac|avisynth)' }
          if ($gplArtifactDlls) {
            throw "Forbidden GPL FFmpeg/codec DLL deployed: $($gplArtifactDlls.FullName -join ', ')"
          }
          foreach ($dll in $deployedFfDlls) {
            $dllDeps = (dumpbin /dependents $dll.FullName | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed on $($dll.Name)" }
            if ($dllDeps -match '(?i)\b(?:lib)?(?:x264|x265|xvidcore|fdk-aac|postproc|avidemux|avisynth)[^\s]*\.dll') {
              throw "Forbidden GPL runtime DLL dependency detected in $($dll.Name):`n$dllDeps"
            }
          }
          echo "Verified CMake FFmpeg path ($expectedInclude) and clean LGPL shared DLL linkage."

      - name: Run CTest
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name 'DontShowUI' -Value 1 -Type DWord -Force -ErrorAction SilentlyContinue
          $testList = (ctest --test-dir build -N | Out-String)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testList -notmatch 'Phase10QmlOffscreenSmoke' -or $testList -notmatch 'Total Tests:\s*30\b') {
            throw "Expected 30 registered CTest entries including Phase10QmlOffscreenSmoke. Found:`n$testList"
          }
          ctest --test-dir build --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Desktop Shell Smoke
        shell: pwsh
        run: |
          .\build\apps\desktop\ave_desktop.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
